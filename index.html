<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CEFR Microphone Test</title><style>body{font:17px system-ui;background:#101e35;color:white;margin:0;padding:24px}main{max-width:480px;margin:40px auto;background:#20334f;padding:24px;border-radius:18px}button{font:inherit;padding:15px;width:100%;margin:8px 0;border:0;border-radius:10px;background:#f3c66b;color:#101e35}button:disabled{opacity:.45}audio{width:100%}p{line-height:1.5}</style></head><body><main><h1>CEFR Microphone Test</h1><p>Record a short sample, stop, then play it back. Nothing is uploaded.</p><button id="start">Start Recording</button><button id="stop" disabled>Stop Recording</button><p id="status" role="status">Ready</p><audio id="play" controls></audio></main><script>const start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),play=document.getElementById('play');let stream,rec,url,timer;function clean(){clearTimeout(timer);stream?.getTracks().forEach(t=>t.stop());start.disabled=false;stop.disabled=true}start.onclick=async()=>{start.disabled=true;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Recording API unavailable in this browser');stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||chunks[0]?.type}));play.src=url;status.textContent='Recording finished. Press Play to listen.';clean()};rec.onerror=e=>{status.textContent='Recording error: '+(e.error?.message||'Unknown error');clean()};rec.start();stop.disabled=false;status.textContent='Recording…';timer=setTimeout(()=>{if(rec.state==='recording')rec.stop()},60000)}catch(e){status.textContent=e.name+': '+e.message;clean()}};stop.onclick=()=>{if(rec?.state==='recording'){stop.disabled=true;rec.stop()}};</script></body></html>
